name: Fetch YouTube Stories Daily (English & Hindi)

on:
  schedule:
    # ⏰ Runs automatically once every 24 hours at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-stories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Latest Stories (English & Hindi)
        run: |
          python update_all_stories.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube_videos.json hindi_stories.json
          if git diff --staged --quiet; then
            echo "No story video changes detected. Both JSON files are up to date."
          else
            git commit -m "Auto-update youtube_videos.json & hindi_stories.json [skip ci]"
            git push
          fi
